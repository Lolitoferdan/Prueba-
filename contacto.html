<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de contacto de Chuchitos con Flow">
  <meta name="author" content="Chuchitos con Flow">
  <meta name="keywords" content="contacto, música, corrido, mensaje, preguntas">
  <title>Contacto - Chuchitos con Flow</title>
  <link rel="icon" href="pene.png" type="image/png">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #1e2a47; /* Azul suave oscuro */
      color: white;
      overflow-x: hidden;
    }

    /* Parallax Background */
    .parallax {
      position: relative;
      background: url('Corrido.png') no-repeat fixed;
      background-size: cover;
      height: 100vh;
      width: 100%;
      z-index: -1;
      transform: scale(1.1);
    }

    /* Animaciones y Transiciones */
    .glow {
      text-shadow: 0 0 20px rgba(255, 0, 64, 1), 0 0 30px rgba(255, 0, 64, 1), 0 0 40px rgba(255, 0, 64, 1);
    }

    h1 {
      font-size: 6em;
      margin-top: 10vh;
      animation: fadeIn 2s ease-in-out;
      text-align: center;
      color: #4fc3f7; /* Azul suave */
    }

    h2 {
      font-size: 3rem;
      color: #4fc3f7;
      text-transform: uppercase;
      margin-top: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.5rem;
      margin-top: 30px;
      font-weight: 600;
      text-align: center;
    }

    /* Efecto Glow */
    .glow-text {
      color: #ff0040;
      text-shadow: 0 0 20px #ff0040, 0 0 30px #ff0040, 0 0 40px #ff0040;
    }

    /* Formulario de contacto */
    .contact-form {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px #4fc3f7;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      border: 2px solid #4fc3f7;
      background-color: #2c3e50;
      color: white;
      font-size: 1.2em;
      resize: vertical;
    }

    .contact-form button {
      background-color: #4fc3f7;
      border: none;
      padding: 15px;
      font-size: 1.5em;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 0 15px #4fc3f7;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background-color: #29b6f6;
      transform: scale(1.05);
    }

    /* Animación de Fade In */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Menú interactivo */
    .menu {
      background: rgba(0, 0, 0, 0.8);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      z-index: 999;
    }

    .menu ul {
      display: flex;
      justify-content: center;
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    .menu ul li {
      margin: 0 15px;
      font-size: 2em;
      color: white;
    }

    .menu ul li:hover {
      color: #4fc3f7;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Menú de Navegación -->
  <div class="menu">
    <ul>
      <li onclick="window.location.href='index.html'">Inicio</li>
      <li onclick="window.location.href='contacto.html'">Contacto</li>
    </ul>
  </div>

  <!-- Fondo Parallax -->
  <div class="parallax"></div>

  <!-- Contenido principal -->
  <div class="content-wrapper">
    <h1 class="glow">Contacto</h1>
    <h2>Envíanos tus preguntas o comentarios</h2>
    <p>EL CONTACTO ES LA PUNTA DE MI CHILITO A QUIEN PORONGAS QUERES CONTACTAR ??</p>

    <!-- Formulario de Contacto -->
    <div class="contact-form">
      <form action="" method="post">
        <input type="text" name="name" placeholder="Tu nombre" required>
        <input type="email" name="email" placeholder="Tu correo electrónico" required>
        <textarea name="message" rows="5" placeholder="Tu mensaje..." required></textarea>
        <button type="submit">Enviar Mensaje</button>
      </form>
    </div>
  </div>

  <script>
    // Este script podría incluir lógica para manejar el formulario de contacto
    // o enviar datos a un servidor, pero por ahora se mantiene simple.
  </script>

</body>
</html>
