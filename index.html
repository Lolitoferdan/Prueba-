<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chuchitos con Flow</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
    }

    .izquierda {
      max-width: 50%;
    }

    .derecha {
      text-align: right;
      max-width: 40%;
      font-size: 1.1rem;
    }

    h1 {
      font-size: 2rem;
      color: #00ffcc;
    }

    audio {
      margin-top: 30px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="izquierda">
    <h1>Somos Chuchitos con Flow</h1>
    <p>Dylan, Steven, Diego, Alejandro, Nelson, Salvador y el mero Pilli</p>
    <p><strong>Somos la mera verga.</strong></p>

    <audio controls autoplay loop>
      <source src="musica.mp3" type="audio/mpeg">
      Tu navegador no soporta el audio.
    </audio>
  </div>

  <div class="derecha">
    <p>Esta página fue creada con el propósito de</p>
    <p><strong>mandar a la verga a Roberto</strong></p>
    <p>por robar novias 😤</p>
    <p>¿Qué pedo XDDD</p>
  </div>

</body>
</html>
