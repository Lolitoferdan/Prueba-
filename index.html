<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chuchitos con Flow</title>
  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      font-family: 'Arial', sans-serif;
      color: #fff;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    .container {
      padding: 30px;
    }

    .main-text {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .izquierda {
      max-width: 55%;
    }

    .derecha {
      max-width: 40%;
      text-align: right;
    }

    /* Estilo del nombre de la canción con cuadro */
    .cancion-title {
      margin-top: 40px;
      font-size: 2.5rem;
      color: #ffcc00;
      background-color: #222;
      padding: 10px 20px;
      border-radius: 8px;
      transition: transform 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
      display: inline-block;
    }

    .cancion-title:hover {
      transform: scale(1.1);
      background-color: #ff6699;
    }

    /* Reproductor de audio desplegable */
    .audio-player {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }

    .audio-player.active {
      max-height: 100px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    /* Estilo del video más pequeño y debajo de texto de Roberto */
    .video-section {
      margin-top: 50px;
      max-width: 80%;
      margin-left: auto;
      margin-right: auto;
    }

    video {
      width: 100%;
      max-width: 600px; /* Ajusta el tamaño del video */
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
    }
  </style>
</head>
<body>

  <!-- 🖼️ Banner estilo canal de YouTube -->
  <header>
    <img src="Corrido.png" alt="Banner">
  </header>

  <div class="container">

    <!-- 🧠 Texto principal -->
    <div class="main-text">
      <div class="izquierda">
        <h1>Somos Chuchitos con Flow</h1>
        <p>Dylan, Steven, Diego, Alejandro, Nelson, Salvador y el mero Pilli</p>
        <p><strong>Somos la mera verga.</strong></p>

        <!-- 🎵 Canción con animación y cuadro -->
        <div class="cancion-title" onclick="toggleAudio()">🎶 Porno Corrido</div>
        <div id="audioPlayer" class="audio-player">
          <audio controls>
            <source src="porno-corrido.mp3" type="audio/mpeg">
            Tu navegador no soporta el audio.
          </audio>
        </div>
      </div>

      <!-- 😤 Texto para Roberto -->
      <div class="derecha">
        <p>Esta página fue creada con el propósito de</p>
        <p><strong>mandar a la verga a Roberto</strong></p>
        <p>por robar novias 😤</p>
        <p>¿Qué pedo XDDD</p>
      </div>
    </div>

    <!-- 🎬 Video abajo (más pequeño) -->
    <div class="video-section">
      <video src="0506.mp4" controls autoplay muted loop></video>
    </div>

  </div>

  <script>
    function toggleAudio() {
      const audioDiv = document.getElementById("audioPlayer");
      audioDiv.classList.toggle("active");
    }
  </script>

</body>
</html>
