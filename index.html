<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chuchitos con Flow</title>
  <link rel="icon" href="pene.png" type="image/png">
  <style>
    /* Fondo negro */
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      font-family: 'Arial', sans-serif;
      color: white;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 3em;
      text-align: center;
      margin-top: 30px;
      text-shadow: 2px 2px 8px black;
    }

    p {
      text-align: center;
      font-size: 1.3em;
      margin-bottom: 40px;
      text-shadow: 2px 2px 5px black;
    }

    /* Cuadro de canciones */
    .cuadro-canciones {
      display: flex;
      flex-direction: column;
      width: 80%;
      max-width: 600px;
      margin: 20px 0;
      border: 2px solid white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px #ff0040;
    }

    .cancion-boton {
      background-color: rgba(0, 0, 0, 0.8);
      border: 2px solid white;
      padding: 15px;
      font-size: 1.5em;
      color: white;
      margin: 10px 0;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #ff0040;
    }

    .cancion-boton:hover {
      transform: scale(1.1);
      background-color: #ff0040;
    }

    /* Reproductor */
    .reproductor {
      display: none;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
    }

    /* Cuadro de video */
    .video-box {
      display: none;
      margin-top: 20px;
      width: 80%;
      max-width: 800px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 0 20px #ff0040;
    }

    /* Botón de video */
    .boton-video {
      display: block;
      width: max-content;
      margin: 20px auto;
      padding: 15px 25px;
      font-size: 1.2em;
      color: white;
      background: #ff0040;
      border: 3px solid white;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.3s ease, background 0.2s ease;
      box-shadow: 0 0 10px #ff0040;
    }

    .boton-video:hover {
      transform: scale(1.1);
      background: #ff3366;
    }

    /* Efecto glow */
    .glow {
      text-shadow: 0 0 20px #ff0040, 0 0 30px #ff0040, 0 0 40px #ff0040, 0 0 50px #ff0040;
    }

  </style>
</head>
<body>

  <!-- Título -->
  <h1 class="glow">Somos Chuchitos con Flow</h1>
  <p class="glow">Dylan Steven, Diego Alejandro, Nelson Salvador, Ernesto Antonio y el pinche mero vergas: el Pilli</p>
  <p class="glow">Esta página fue creada con el propósito de mandar a la verga a Roberto por robar novias. ¿Qué pedo? XDDD</p>

  <!-- Cuadro de canciones -->
  <div class="cuadro-canciones">
    <div class="cancion-boton" onclick="toggleReproductor('audio1', 'reproductor1')">
      PORNO CORRIDO
    </div>
    <div class="cancion-boton" onclick="toggleReproductor('audio2', 'reproductor2')">
      OTRA CANCION
    </div>
  </div>

  <!-- Reproductor de audio 1 (PORNO CORRIDO) -->
  <div class="reproductor" id="reproductor1">
    <audio id="audio1" controls>
      <source src="(intro hablada) (1).mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Reproductor de audio 2 (OTRA CANCION) -->
  <div class="reproductor" id="reproductor2">
    <audio id="audio2" controls>
      <source src="otra-cancion.mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Botón para ver el video -->
  <div class="boton-video" onclick="document.getElementById('videoBox').style.display='block';">
    VER VIDEO
  </div>

  <!-- Cuadro de video -->
  <div class="video-box" id="videoBox">
    <video width="100%" controls>
      <source src="0506.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
  </div>

  <!-- Script para mostrar el reproductor de audio al hacer clic -->
  <script>
    function toggleReproductor(audioId, reproductorId) {
      // Mostrar o esconder el reproductor de audio correspondiente
      const reproductor = document.getElementById(reproductorId);
      const audio = document.getElementById(audioId);

      if (reproductor.style.display === 'none' || reproductor.style.display === '') {
        reproductor.style.display = 'block';
        audio.play();
      } else {
        reproductor.style.display = 'none';
        audio.pause();
      }
    }
  </script>

</body>
</html>
