<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chuchitos con Flow</title>
  <link rel="icon" type="image/png" href="pene.png" />
  <style>
    body {
      margin: 0;
      background: black;
      font-family: 'Arial Black', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    header img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    h1 {
      font-size: 3em;
      text-align: center;
      margin: 30px 0 10px;
      text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    }

    .roberto {
      font-size: 1.2em;
      text-align: right;
      margin: 10px 30px;
      color: #f55;
      text-shadow: 0 0 10px #f00;
    }

    .cancion-title, .video-title {
      width: fit-content;
      margin: 40px auto;
      padding: 20px 40px;
      background: linear-gradient(45deg, #ff0080, #7928ca);
      border-radius: 20px;
      cursor: pointer;
      font-size: 2em;
      box-shadow: 0 0 20px #ff0080;
      transition: transform 0.3s ease;
    }

    .cancion-title:hover, .video-title:hover {
      transform: scale(1.1);
    }

    .audio-player, .video-player {
      text-align: center;
      margin: 20px 0;
      display: none;
    }

    .audio-player.active, .video-player.active {
      display: block;
    }

    audio {
      width: 80%;
      max-width: 600px;
    }

    video {
      width: 80%;
      max-width: 800px;
      border-radius: 20px;
      margin: 20px auto;
      display: block;
      box-shadow: 0 0 30px #0ff;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>

  <canvas id="visualizer"></canvas>

  <header>
    <img src="Corrido.png" alt="Banner Corrido" />
  </header>

  <h1>Somos Chuchitos con Flow</h1>
  <h2 style="text-align: center;">Dylan, Steven, Diego, Alejandro, Nelson, Salvador y el mero Pilli somos la mera verga</h2>

  <div class="roberto">
    Esta página fue creada con el propósito de mandar a la verga a Roberto por robar novias 😎
  </div>

  <!-- Botón para mostrar reproductor de la canción -->
  <div class="cancion-title" onclick="toggleAudio()">🎶 Porno Corrido</div>
  <div id="audioPlayer" class="audio-player">
    <audio id="audio" controls>
      <source src="porno-corrido.mp3" type="audio/mpeg">
      Tu navegador no soporta el audio.
    </audio>
  </div>

  <!-- Botón para mostrar video -->
  <div class="video-title" onclick="toggleVideo()">📹 Ver Video</div>
  <div id="videoPlayer" class="video-player">
    <video controls>
      <source src="0506.mp4" type="video/mp4">
      Tu navegador no soporta el video.
    </video>
  </div>

  <!-- Script para mostrar reproductores -->
  <script>
    function toggleAudio() {
      const audioDiv = document.getElementById("audioPlayer");
      const audio = document.getElementById("audio");
      audioDiv.classList.toggle("active");
      if (audioDiv.classList.contains("active")) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function toggleVideo() {
      const videoDiv = document.getElementById("videoPlayer");
      videoDiv.classList.toggle("active");
    }
  </script>

  <!-- Visualizador tipo espectro -->
  <script>
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");
    let audioCtx, analyser, source, bufferLength, dataArray;

    function setupVisualizer() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      const audio = document.getElementById("audio");
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      function animate() {
        requestAnimationFrame(animate);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          barHeight = dataArray[i] * 1.5;
          ctx.fillStyle = `rgb(${barHeight+100},50,150)`;
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      animate();
    }

    document.getElementById("audio").addEventListener("play", () => {
      if (!audioCtx) setupVisualizer();
    });

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
