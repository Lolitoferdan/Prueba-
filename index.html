<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chuchitos con Flow</title>
  <link rel="icon" href="pene.png" type="image/png">
  <style>
    /* Fondo con imagen y capa oscura */
    body {
      margin: 0;
      padding: 0;
      background: url('1.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Arial', sans-serif;
      color: white;
      position: relative;
      z-index: 1;
    }

    body::before {
      content: "";
      background: rgba(0, 0, 0, 0.5); /* oscurecer fondo */
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    h1 {
      font-size: 3em;
      text-align: center;
      margin-top: 30px;
      text-shadow: 2px 2px 8px black;
    }

    p {
      text-align: center;
      font-size: 1.3em;
      margin-bottom: 40px;
      text-shadow: 2px 2px 5px black;
    }

    .boton-cancion, .boton-video {
      display: block;
      width: max-content;
      margin: 20px auto;
      padding: 15px 25px;
      font-size: 1.2em;
      color: white;
      background: #ff0040;
      border: 3px solid white;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.3s ease, background 0.2s ease;
    }

    .boton-cancion:hover, .boton-video:hover {
      transform: scale(1.1);
      background: #ff3366;
    }

    .reproductor, .video-box {
      display: none;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
    }

    .cuadro-cancion {
      border: 4px solid white;
      padding: 15px;
      text-align: center;
      width: max-content;
      margin: auto;
      font-size: 2em;
      font-weight: bold;
      box-shadow: 0 0 15px #ff0040;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .cuadro-cancion:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <h1>Somos Chuchitos con Flow</h1>
  <p>Dylan, Steven, Diego, Alejandro, Nelson, Salvador y el mero Pilli somos la mera verga</p>
  <p>Esta página fue creada con el propósito de mandar a la verga a Roberto por robar novias. ¿Qué pedo? XDDD</p>

  <!-- Botón de canción -->
  <div class="cuadro-cancion" onclick="document.getElementById('reproductor1').style.display='block'; document.getElementById('audio1').play();">
    PORNO CORRIDO
  </div>

  <!-- Reproductor de audio -->
  <div class="reproductor" id="reproductor1">
    <audio id="audio1" controls>
      <source src="(intro hablada) (1).mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Botón de video -->
  <div class="cuadro-cancion" onclick="document.getElementById('videoBox').style.display='block';">
    VER VIDEO
  </div>

  <!-- Video -->
  <div class="video-box" id="videoBox">
    <video width="100%" controls>
      <source src="0506.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
  </div>

</body>
</html>
