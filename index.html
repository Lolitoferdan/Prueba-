<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuchitos con Flow</title>
  <link rel="icon" href="pene.png" type="image/png">

  <style>
    /* Estilos generales */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: black;
      color: white;
      overflow-x: hidden;
    }

    /* Efecto Parallax */
    .parallax {
      position: relative;
      background: url('1.jpg') no-repeat fixed;
      background-size: cover;
      height: 100vh;
      width: 100%;
      z-index: -1;
      transform: scale(1.1);
    }

    /* Fondo negro y efectos globales */
    h1, h2, p {
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 0, 64, 0.8), 0 0 25px rgba(255, 0, 64, 0.8), 0 0 40px rgba(255, 0, 64, 0.8);
    }

    h1 {
      font-size: 5rem;
      margin-top: 10vh;
      transition: font-size 0.5s ease;
    }

    h2 {
      font-size: 2rem;
      color: #ff0040;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: -20px;
    }

    p {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    /* Efecto Glow */
    .glow {
      text-shadow: 0 0 20px rgba(255, 0, 64, 1), 0 0 30px rgba(255, 0, 64, 1), 0 0 40px rgba(255, 0, 64, 1);
    }

    /* Cuadro de canciones */
    .cuadro-canciones {
      width: 80%;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      border: 2px solid #ff0040;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 0, 64, 1);
    }

    .cancion-boton {
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid #ff0040;
      padding: 18px;
      margin: 12px 0;
      font-size: 1.8em;
      color: white;
      cursor: pointer;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 15px #ff0040;
      transition: 0.3s;
    }

    .cancion-boton:hover {
      background: #ff0040;
      transform: scale(1.1);
    }

    /* Botón de Video */
    .boton-video {
      display: inline-block;
      margin: 30px auto;
      padding: 20px 30px;
      font-size: 1.4em;
      background: #ff0040;
      border: 3px solid white;
      border-radius: 15px;
      color: white;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px #ff0040;
      transition: background 0.3s, transform 0.3s;
    }

    .boton-video:hover {
      background: #ff3366;
      transform: scale(1.1);
    }

    /* Reproductores */
    .reproductor {
      display: none;
      margin: 20px auto;
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 20px #ff0040;
    }

    /* Video */
    .video-box {
      display: none;
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 30px rgba(255, 0, 64, 1);
    }

    /* Animación de texto en la pantalla de bienvenida */
    .welcome-text {
      font-size: 3em;
      animation: fadeIn 2s ease-in-out;
    }

    /* Efecto de Fade In */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Barra de espectro de audio */
    .audio-spectrum {
      display: none;
      width: 100%;
      height: 3px;
      background-color: #ff0040;
      margin: 20px 0;
    }

  </style>
</head>
<body>

  <!-- Fondo Parallax -->
  <div class="parallax"></div>

  <!-- Título de bienvenida con animación -->
  <h1 class="glow welcome-text">Somos Chuchitos con Flow</h1>
  <h2 class="glow">Dylan Steven, Diego Alejandro, Nelson Salvador, Ernesto Antonio y el pinche mero vergas: el Pilli</h2>
  <p class="glow">Esta página fue creada con el propósito de mandar a la verga a Roberto por robar novias. ¿Qué pedo? XDDD</p>

  <!-- Cuadro de canciones -->
  <div class="cuadro-canciones">
    <div class="cancion-boton" onclick="toggleReproductor('audio1', 'reproductor1')">PORNO CORRIDO</div>
    <div class="cancion-boton" onclick="toggleReproductor('audio2', 'reproductor2')">CANCION 2</div>
    <div class="cancion-boton" onclick="toggleReproductor('audio3', 'reproductor3')">CANCION 3</div>
  </div>

  <!-- Reproductor de audio 1 (PORNO CORRIDO) -->
  <div class="reproductor" id="reproductor1">
    <audio id="audio1" controls>
      <source src="(intro hablada) (1).mp3" type="audio/mp3">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Reproductor de audio 2 -->
  <div class="reproductor" id="reproductor2">
    <audio id="audio2" controls>
      <source src="cancion2.mp3" type="audio/mp3">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Reproductor de audio 3 -->
  <div class="reproductor" id="reproductor3">
    <audio id="audio3" controls>
      <source src="cancion3.mp3" type="audio/mp3">
      Tu navegador no soporta audio.
    </audio>
  </div>

  <!-- Botón de Video -->
  <div class="boton-video" onclick="document.getElementById('videoBox').style.display='block';">VER VIDEO</div>

  <!-- Cuadro de Video -->
  <div class="video-box" id="videoBox">
    <video width="100%" controls>
      <source src="0506.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
  </div>

  <!-- Espectro de Audio -->
  <div class="audio-spectrum" id="audioSpectrum"></div>

  <!-- Script para mostrar el reproductor y video -->
  <script>
    function toggleReproductor(audioId, reproductorId) {
      var reproductor = document.getElementById(reproductorId);
      var audio = document.getElementById(audioId);

      if (reproductor.style.display === 'none' || reproductor.style.display === '') {
        reproductor.style.display = 'block';
        audio.play();
      } else {
        reproductor.style.display = 'none';
        audio.pause();
      }
    }

    // Mostrar espectro de audio (esto debe tener un script adicional de visualización de espectro)
    var audioElement = document.getElementById('audio1');
    var spectrum = document.getElementById('audioSpectrum');
    audioElement.onplay = function() {
      spectrum.style.display = 'block';
      // Aquí debería ir la lógica para representar el espectro de audio con canvas o Web Audio API
    }
  </script>

</body>
</html>
