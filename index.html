<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuchitos con Flow</title>

  <!-- Aquí agregas el favicon (el ícono que aparece en la pestaña del navegador) -->
  <link rel="icon" href="https://github.com/Lolitoferdan/Prueba-/raw/main/pene.png" type="image/png">

  <style>
    /* Fondo de espectro de audio */
    body {
      margin: 0;
      background-color: #111;
      font-family: 'Arial', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    .container {
      padding: 30px;
    }

    .main-text {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      position: relative;
    }

    .izquierda {
      max-width: 55%;
    }

    .derecha {
      max-width: 40%;
      text-align: right;
    }

    /* Estilo para el título grande */
    h1 {
      font-size: 4rem;
      color: #ffcc00;
      text-transform: uppercase;
      margin-bottom: 0;
    }

    .cancion-title {
      font-size: 3rem;
      color: #ffcc00;
      background-color: #222;
      padding: 10px 20px;
      border-radius: 8px;
      transition: transform 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
      display: inline-block;
      margin-top: 40px;
    }

    .cancion-title:hover {
      transform: scale(1.1);
      background-color: #ff6699;
    }

    /* Reproductor de audio desplegable */
    .audio-player {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }

    .audio-player.active {
      max-height: 100px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    /* Video interactivo */
    .video-section {
      margin-top: 50px;
      max-width: 80%;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }

    .video-section.active {
      display: block;
    }

    video {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
    }

    /* Fondo con espectro de audio (estático por ahora, lo hacemos después con JS) */
    #audio-spectrogram {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Espectro de audio (se va a manejar con JS después) -->
  <div id="audio-spectrogram"></div>

  <!-- 🖼️ Banner estilo canal de YouTube -->
  <header>
    <img src="Corrido.png" alt="Banner">
  </header>

  <div class="container">

    <!-- 🧠 Texto principal -->
    <div class="main-text">
      <div class="izquierda">
        <h1>Somos Chuchitos con Flow</h1>
        <p>Dylan, Steven, Diego, Alejandro, Nelson, Salvador y el mero Pilli</p>
        <p><strong>Somos la mera verga.</strong></p>

        <!-- 🎵 Canción con animación y cuadro -->
        <div class="cancion-title" onclick="toggleAudio()">🎶 Porno Corrido</div>
        <div id="audioPlayer" class="audio-player">
          <audio id="audio" controls>
            <source src="porno-corrido.mp3" type="audio/mpeg">
            Tu navegador no soporta el audio.
          </audio>
        </div>
      </div>

      <!-- 😤 Texto para Roberto -->
      <div class="derecha">
        <p>Esta página fue creada con el propósito de</p>
        <p><strong>mandar a la verga a Roberto</strong></p>
        <p>por robar novias 😤</p>
        <p>¿Qué pedo XDDD</p>

        <!-- Botón para mostrar el video -->
        <button onclick="toggleVideo()">Ver video</button>
      </div>
    </div>

    <!-- 🎬 Video abajo (más pequeño) -->
    <div class="video-section" id="videoSection">
      <video src="0506.mp4" controls autoplay muted loop></video>
    </div>

  </div>

  <script>
    // Toggle del reproductor de audio
    function toggleAudio() {
      const audioDiv = document.getElementById("audioPlayer");
      audioDiv.classList.toggle("active");
    }

    // Toggle del video
    function toggleVideo() {
      const videoSection = document.getElementById("videoSection");
      videoSection.classList.toggle("active");
    }

    // Generación de espectro de audio
    const audioElement = document.getElementById('audio');
    const spectrogram = document.getElementById('audio-spectrogram');

    audioElement.onplay = () => {
      // Aquí agregaríamos el espectro de audio que reaccione
      spectrogram.style.background = "linear-gradient(to right, #ff6699, #ffcc00, #00ccff)";
    };

    audioElement.onpause = () => {
      // Espectro de fondo cuando el audio está en pausa
      spectrogram.style.background = "rgba(0, 0, 0, 0.5)";
    };
  </script>

</body>
</html>
